<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — {{LOGIN_TITLE}}</title>
  <script>(function(){try{var k='midleman_theme',p=localStorage.getItem(k);if(p!=='dark'&&p!=='light'&&p!=='system')p='dark';var t=p==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;document.documentElement.setAttribute('data-theme',t);if(p==='system'&&window.matchMedia){var m=matchMedia('(prefers-color-scheme: dark)');var fn=function(e){if(localStorage.getItem(k)==='system')document.documentElement.setAttribute('data-theme',e.matches?'dark':'light')};if(m.addEventListener)m.addEventListener('change',fn);else if(m.addListener)m.addListener(fn)}}catch(e){}})();</script>
  <!-- MM_THEME -->
  <link rel="icon" href="{{LOGIN_LOGO_URL}}" type="image/x-icon">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }
    * { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }

    body {
      font-family: var(--font-sans);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Legacy animated background: kept in the DOM because the inline script draws on it,
       but hidden; the grid ground replaces it. */

    .main {
      width: 100%;
      max-width: 392px;
      padding: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    /* Profile brand (logo + title) — the primary identity of this page */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 20px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
      min-width: 0;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      object-fit: contain;
      border-radius: var(--radius-sm);
    }
    .brand-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main h2 {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .welcome,
    .subtitle,
    .setup-info {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .error {
      background: var(--red-bg);
      border: 1px solid var(--red-bdr);
      color: var(--red);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.45;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 7px;
    }
    .form-group input {
      width: 100%;
      height: var(--control-h-lg);
      padding: 0 12px;
      font-size: 13.5px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition);
      font-family: inherit;
    }
    .form-group input:hover { border-color: var(--text3); }
    .form-group input:focus,
    .form-group input:focus-visible { border-color: var(--accent); outline: none; }
    .form-group input::placeholder { color: var(--text3); opacity: .7; }
    .form-group input:disabled { opacity: .55; cursor: not-allowed; }
    /* Autofill: keep token colours instead of the browser fill (delayed transition, no inset shadow). */
    .form-group input:-webkit-autofill,
    .form-group input:-webkit-autofill:hover,
    .form-group input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      caret-color: var(--text);
      transition: background-color 600000s 0s, color 600000s 0s;
    }

    .form-group input.totp-input {
      height: 48px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 10px;
      padding-left: 22px; /* optically re-centre after the trailing letter-spacing */
    }

    .btn-primary {
      width: 100%;
      height: var(--control-h-lg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--on-accent);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      transition: background var(--transition), border-color var(--transition);
      font-family: inherit;
    }
    .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary:disabled:hover { background: var(--accent); border-color: var(--accent); }
    .btn-primary .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--on-accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-back {
      width: 100%;
      height: var(--control-h-lg);
      justify-content: center;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      border: 1px solid var(--border2);
      background: transparent;
      cursor: pointer;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      transition: border-color var(--transition), color var(--transition);
      font-family: inherit;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }

    .forgot-row { margin-top: 14px; text-align: center; font-size: 12.5px; }
    .forgot-row a { color: var(--text3); text-decoration: none; transition: color var(--transition); }
    .forgot-row a:hover { color: var(--accent); }

    .step { display: none; }
    .step.active { display: block; }

    .qr-row { text-align: center; }
    .qr-wrap {
      display: inline-block;
      margin: 0 0 14px;
      padding: 12px;
      background: #FFFFFF; /* QR codes need a light quiet zone in both themes */
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      line-height: 0;
    }
    .qr-wrap img { width: 168px; height: 168px; }

    .secret-code {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .5px;
      background: var(--surface2);
      border: 1px dashed var(--border2);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text);
      word-break: break-all;
      text-align: center;
      margin: 0 0 18px;
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition);
    }
    .secret-code:hover { border-color: var(--accent); color: var(--accent); }

    /* "secured by Midleman" — the only Midleman branding on a profile's login page */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text3);
    }
    .footer .mm-mark { width: 13px; height: 13px; border: 0; border-radius: 0; }
    .footer .mm-mark svg { width: 13px; height: 13px; stroke: var(--accent); }
    .footer strong { font-weight: 500; color: var(--text2); }

    @media (max-width: 420px) {
      body { padding: 24px 16px; }
      .main { padding: 24px 20px; }
      .main h2 { font-size: 22px; }
    }

    .consent-overlay {
      position: fixed; inset: 0; background: var(--overlay);
      display: flex; align-items: center; justify-content: center; padding: 16px;
      z-index: 1000;
    }
    .consent-box {
      width: 100%; max-width: 540px; max-height: 85vh;
      background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg);
      display: flex; flex-direction: column;
    }
    .consent-head { padding: 20px 24px 14px; border-bottom: 1px solid var(--border); }
    .consent-head h2 {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 600; color: var(--text);
      margin: 0; letter-spacing: -0.2px; line-height: 1.3;
    }
    .consent-body {
      padding: 16px 24px; overflow-y: auto; flex: 1;
      font-size: 13px; line-height: 1.6; color: var(--text2);
    }
    .consent-body p { margin: 0 0 10px; }
    .consent-body p:last-child { margin-bottom: 0; }
    .consent-body ul { padding-left: 20px; margin: 0 0 10px; }
    .consent-body li { margin: 4px 0; }
    .consent-body a { color: var(--accent); text-decoration: underline; }
    .consent-body a:hover { color: var(--accent2); }
    .consent-body strong { font-weight: 600; color: var(--text); }
    .consent-foot { padding: 14px 24px 18px; border-top: 1px solid var(--border); }
    .consent-foot button {
      width: 100%; height: var(--control-h-lg);
      background: var(--accent); color: var(--on-accent);
      border: 1px solid var(--accent); border-radius: var(--radius-sm);
      font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background var(--transition), border-color var(--transition);
    }
    .consent-foot button:hover { background: var(--accent2); border-color: var(--accent2); }
    @media (max-width: 420px) {
      .consent-head, .consent-body, .consent-foot { padding-left: 18px; padding-right: 18px; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="mm-grid-ground">
  <div id="consentModal" class="consent-overlay hidden" data-enabled="{{CONSENT_ENABLED}}">
    <div class="consent-box mm-frame">
      <div class="consent-head"><h2>{{CONSENT_TITLE}}</h2></div>
      <div class="consent-body">{{CONSENT_BODY}}</div>
      <div class="consent-foot"><button type="button" id="consentAccept">Accept and continue</button></div>
    </div>
  </div>


  <main class="main mm-frame">
    <div class="brand">
      <img class="brand-logo" src="{{LOGIN_LOGO_URL}}" alt="" onerror="this.style.display='none'">
      <span class="brand-name">{{LOGIN_TITLE}}</span>
    </div>

    <div class="step active" id="step1">
      <h2 id="h2step1"></h2>
      <div class="welcome" id="welcomeMsg"></div>
      <div class="error" id="loginError"></div>
      <div class="form-group">
        <label id="lblUser"></label>
        <input type="text" id="loginUser" autocomplete="username">
      </div>
      <div class="form-group">
        <label id="lblPass"></label>
        <input type="password" id="loginPass" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="loginBtn" onclick="doStep1()"></button>
      <div class="forgot-row"><a href="#" id="forgotLink" onclick="doForgot(event)"></a></div>
    </div>

    <div class="step" id="step2verify">
      <h2 id="h2step2verify"></h2>
      <div class="subtitle" id="subtitleVerify"></div>
      <div class="error" id="totpVerifyError"></div>
      <div class="form-group">
        <label id="lblTotp"></label>
        <input type="text" id="totpVerifyCode" class="totp-input" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
      </div>
      <button class="btn-primary" id="totpVerifyBtn" onclick="doTotpVerify()"></button>
      <button class="btn-back" onclick="backToStep1()"></button>
    </div>

    <div class="step" id="step2setup">
      <h2 id="h2step2setup"></h2>
      <div class="setup-info" id="subtitleSetup"></div>
      <div class="error" id="totpSetupError"></div>
      <div class="qr-row">
        <div class="qr-wrap"><img id="qrImage" src="" alt="QR Code"></div>
      </div>
      <div class="secret-code" id="secretCode" onclick="copySecret()" title="Click to copy"></div>
      <div class="form-group">
        <label id="lblTotpConfirm"></label>
        <input type="text" id="totpSetupCode" class="totp-input" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
      </div>
      <button class="btn-primary" id="totpSetupBtn" onclick="doTotpSetup()"></button>
      <button class="btn-back" onclick="backToStep1()"></button>
    </div>
  </main>

  <footer class="footer">secured by <span class="mm-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12h6.5"/><circle cx="12" cy="12" r="3.3"/><path d="M15 10.4 21.5 5.5"/><path d="M15.4 12H22"/><path d="M15 13.6 21.5 18.5"/></svg></span><strong>Midleman</strong></footer>

  <script>

    const PROFILE = '{{PROFILE_NAME}}';
    let challengeToken = '', setupTotpSecret = '';

    const lang = navigator.language?.toLowerCase().startsWith('pt') ? 'pt' : 'en';
    const t = {
      en: {
        signIn: 'Sign In', verification: 'Verification', setup2fa: 'Set Up 2FA',
        welcome: 'Welcome back. Please enter your credentials to continue.',
        userLabel: 'Username or email', passLabel: 'Password', totpLabel: 'Authenticator Code', totpConfirmLabel: 'Enter the 6-digit code to confirm',
        userPh: 'Username or email', passPh: 'Password', totpPh: '000000',
        continueBtn: 'Continue', signingIn: 'Signing in...', signInBtn: 'Sign In', verifying: 'Verifying...',
        verifyBtn: 'Verify & Sign In', back: 'Back',
        subtitleVerify: 'Enter the 6-digit code from your authenticator app.',
        subtitleSetup: 'This application requires two-factor authentication. Scan the QR code with your authenticator app.',
        errRequired: 'Username and password are required.',
        errLogin: 'Login failed.', errConn: 'Connection error. Please try again.',
        errTotp: 'Enter the 6-digit code.', errTotpFail: 'Verification failed.', errSetupFail: 'Setup failed.',
        errSetupCode: 'Enter the 6-digit code from your authenticator.',
        forgotLink: 'Forgot password?',
        forgotPrompt: 'Enter your email address',
        forgotSent: 'If an account exists for this address, a password reset email has been sent.',
        forgotInvalidEmail: 'Enter a valid email address.',
      },
      pt: {
        signIn: 'Entrar', verification: 'Verificação', setup2fa: 'Configurar 2FA',
        welcome: 'Bem-vindo. Introduza as suas credenciais para continuar.',
        userLabel: 'Utilizador ou email', passLabel: 'Palavra-passe', totpLabel: 'Código do Autenticador', totpConfirmLabel: 'Introduza o código de 6 dígitos para confirmar',
        userPh: 'Utilizador ou email', passPh: 'Palavra-passe', totpPh: '000000',
        continueBtn: 'Continuar', signingIn: 'A entrar...', signInBtn: 'Entrar', verifying: 'A verificar...',
        verifyBtn: 'Verificar e Entrar', back: 'Voltar',
        subtitleVerify: 'Introduza o código de 6 dígitos da sua aplicação de autenticação.',
        subtitleSetup: 'Esta aplicação requer autenticação de dois fatores. Leia o código QR com a sua aplicação de autenticação.',
        errRequired: 'Utilizador e palavra-passe são obrigatórios.',
        errLogin: 'Falha no início de sessão.', errConn: 'Erro de ligação. Tente novamente.',
        errTotp: 'Introduza o código de 6 dígitos.', errTotpFail: 'Verificação falhada.', errSetupFail: 'Configuração falhada.',
        errSetupCode: 'Introduza o código de 6 dígitos do seu autenticador.',
        forgotLink: 'Esqueceu a palavra-passe?',
        forgotPrompt: 'Introduza o seu endereço de email',
        forgotSent: 'Se existir uma conta para este endereço, foi enviado um email de reposição de palavra-passe.',
        forgotInvalidEmail: 'Introduza um endereço de email válido.',
      },
    }[lang];

    function applyLang() {
      document.getElementById('h2step1').textContent = t.signIn;
      document.getElementById('welcomeMsg').textContent = t.welcome;
      document.getElementById('h2step2verify').textContent = t.verification;
      document.getElementById('h2step2setup').textContent = t.setup2fa;
      document.getElementById('lblUser').textContent = t.userLabel;
      document.getElementById('lblPass').textContent = t.passLabel;
      document.getElementById('lblTotp').textContent = t.totpLabel;
      document.getElementById('lblTotpConfirm').textContent = t.totpConfirmLabel;
      document.getElementById('loginUser').placeholder = t.userPh;
      document.getElementById('loginPass').placeholder = t.passPh;
      document.getElementById('totpVerifyCode').placeholder = t.totpPh;
      document.getElementById('totpSetupCode').placeholder = t.totpPh;
      document.getElementById('loginBtn').textContent = t.continueBtn;
      document.getElementById('totpVerifyBtn').textContent = t.signInBtn;
      document.getElementById('totpSetupBtn').textContent = t.verifyBtn;
      document.querySelectorAll('.btn-back').forEach(b => b.textContent = t.back);
      document.getElementById('subtitleVerify').textContent = t.subtitleVerify;
      document.getElementById('subtitleSetup').textContent = t.subtitleSetup;
      const fl = document.getElementById('forgotLink'); if (fl) fl.textContent = t.forgotLink;
    }
    applyLang();

    async function doForgot(ev) {
      if (ev) ev.preventDefault();
      const cur = (document.getElementById('loginUser').value || '').trim();
      const email = (cur.indexOf('@') !== -1 ? cur : prompt(t.forgotPrompt) || '').trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('loginError', t.forgotInvalidEmail); return; }
      clearErrors();
      try {
        await fetch('/auth/forgot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      } catch {}
      const el = document.getElementById('loginError');
      if (el) { el.textContent = t.forgotSent; el.classList.add('visible'); el.style.color = 'var(--green)'; el.style.background = 'var(--green-bg)'; el.style.borderColor = 'var(--green-bdr)'; }
    }

    // Enter in either field submits, exactly like clicking the sign-in button.
    const submitOnEnter = e => { if (e.key === 'Enter') { e.preventDefault(); if (!document.getElementById('loginBtn').disabled) doStep1(); } };
    document.getElementById('loginUser').addEventListener('keydown', submitOnEnter);
    document.getElementById('loginPass').addEventListener('keydown', submitOnEnter);
    document.getElementById('totpVerifyCode').addEventListener('keydown', e => { if (e.key === 'Enter') doTotpVerify(); });
    document.getElementById('totpSetupCode').addEventListener('keydown', e => { if (e.key === 'Enter') doTotpSetup(); });

    function showStep(id) { document.querySelectorAll('.step').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function showError(elId, msg) { const el = document.getElementById(elId); el.textContent = msg; el.classList.add('visible'); }
    function clearErrors() { document.querySelectorAll('.error').forEach(e => { e.classList.remove('visible'); e.textContent = ''; }); }
    function backToStep1() { clearErrors(); challengeToken = ''; setupTotpSecret = ''; showStep('step1'); }

    async function doStep1() {
      const btn = document.getElementById('loginBtn');
      clearErrors();
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!username || !password) { showError('loginError', t.errRequired); return; }
      btn.disabled = true; btn.textContent = t.signingIn;
      let nav = false;
      try {
        const res = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (!res.ok) { showError('loginError', data.error || t.errLogin); return; }
        if (data.status === 'ok') { nav = true; doRedirect(); return; }
        challengeToken = data.challengeToken;
        if (data.status === 'totp_required') {
          showStep('step2verify'); document.getElementById('totpVerifyCode').value = ''; document.getElementById('totpVerifyCode').focus();
        } else if (data.status === 'totp_setup') {
          setupTotpSecret = data.totpSecret;
          document.getElementById('qrImage').src = data.qrDataUrl || '';
          document.getElementById('secretCode').textContent = data.totpSecret;
          showStep('step2setup'); document.getElementById('totpSetupCode').value = ''; document.getElementById('totpSetupCode').focus();
        }
      } catch { showError('loginError', t.errConn); }
      finally { if (!nav) { btn.disabled = false; btn.textContent = t.continueBtn; } }
    }

    async function doTotpVerify() {
      const btn = document.getElementById('totpVerifyBtn'); clearErrors();
      const code = document.getElementById('totpVerifyCode').value.trim();
      if (!code || code.length !== 6) { showError('totpVerifyError', t.errTotp); return; }
      btn.disabled = true; btn.textContent = t.verifying;
      let nav = false;
      try {
        const res = await fetch('/auth/totp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ challengeToken, totpCode: code }) });
        const data = await res.json();
        if (!res.ok) { showError('totpVerifyError', data.error || t.errTotpFail); return; }
        nav = true; doRedirect();
      } catch { showError('totpVerifyError', t.errConn); }
      finally { if (!nav) { btn.disabled = false; btn.textContent = t.signInBtn; } }
    }

    async function doTotpSetup() {
      const btn = document.getElementById('totpSetupBtn'); clearErrors();
      const code = document.getElementById('totpSetupCode').value.trim();
      if (!code || code.length !== 6) { showError('totpSetupError', t.errSetupCode); return; }
      btn.disabled = true; btn.textContent = t.verifying;
      let nav = false;
      try {
        const res = await fetch('/auth/totp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ challengeToken, totpCode: code, totpSecret: setupTotpSecret }) });
        const data = await res.json();
        if (!res.ok) { showError('totpSetupError', data.error || t.errSetupFail); return; }
        nav = true; doRedirect();
      } catch { showError('totpSetupError', t.errConn); }
      finally { if (!nav) { btn.disabled = false; btn.textContent = t.verifyBtn; } }
    }

    function doRedirect() {
      const activeStep = document.querySelector('.step.active');
      if (activeStep) { const btn = activeStep.querySelector('.btn-primary'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; } }
      const redirect = new URLSearchParams(window.location.search).get('redirect');
      if (redirect) {
        try {
          const u = new URL(redirect, window.location.origin);
          if (u.origin === window.location.origin) { window.location.href = u.pathname + u.search + u.hash; }
          else window.location.href = '/';
        } catch { window.location.href = '/'; }
      } else if (window.location.pathname.endsWith('/auth/login')) window.location.href = '/';
      else window.location.reload();
    }

    function copySecret() { navigator.clipboard.writeText(document.getElementById('secretCode').textContent).catch(() => {}); }

    (function initConsent() {
      const modal = document.getElementById('consentModal');
      if (!modal) return;
      if (modal.dataset.enabled !== '1') { modal.remove(); return; }
      modal.classList.remove('hidden');
      const loginBtn = document.getElementById('loginBtn');
      const loginUser = document.getElementById('loginUser');
      const loginPass = document.getElementById('loginPass');
      loginBtn.disabled = true;
      loginUser.disabled = true;
      loginPass.disabled = true;
      document.getElementById('consentAccept').addEventListener('click', () => {
        modal.remove();
        loginBtn.disabled = false;
        loginUser.disabled = false;
        loginPass.disabled = false;
        loginUser.focus();
      });
    })();
  </script>
</body>
</html>

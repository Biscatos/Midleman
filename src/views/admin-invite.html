<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Administrador — Midleman</title>
  <script>(function(){try{var k='midleman_theme',p=localStorage.getItem(k);if(p!=='dark'&&p!=='light'&&p!=='system')p='dark';var t=p==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;document.documentElement.setAttribute('data-theme',t);if(p==='system'&&window.matchMedia){var m=matchMedia('(prefers-color-scheme: dark)');var fn=function(e){if(localStorage.getItem(k)==='system')document.documentElement.setAttribute('data-theme',e.matches?'dark':'light')};if(m.addEventListener)m.addEventListener('change',fn);else if(m.addListener)m.addListener(fn)}}catch(e){}})();</script>
  <!-- MM_THEME -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
    * { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
    body { font-family: var(--font-sans); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 24px 16px; -webkit-font-smoothing: antialiased; }
    .main { width: 100%; max-width: 440px; margin: auto; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 30px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; min-width: 0; font-size: 16px; }
    .brand-name { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: -0.1px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    h2 { font-family: var(--font-display); font-size: 23px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.25; margin-bottom: 6px; overflow-wrap: anywhere; }
    .greeting { font-size: 13px; color: var(--text2); margin-bottom: 22px; line-height: 1.55; }
    .invalid-title { margin-bottom: 10px; }
    .invalid-msg { font-size: 13px; color: var(--text2); line-height: 1.6; }
    .info-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 22px; }
    .info-row { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
    .info-row + .info-row { margin-top: 7px; }
    .info-label { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); white-space: nowrap; min-width: 52px; }
    .info-val { color: var(--text); word-break: break-all; }
    .note-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text2); font-style: italic; line-height: 1.5; }
    .error { background: var(--red-bg); border: 1px solid var(--red-bdr); color: var(--red); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.5; margin-bottom: 18px; display: none; }
    .error.visible { display: block; }
    .success-box { background: var(--green-bg); border: 1px solid var(--green-bdr); color: var(--green); padding: 16px; border-radius: var(--radius); font-size: 13.5px; line-height: 1.6; display: none; }
    .success-box.visible { display: block; }
    .success-box svg { display: block; margin-bottom: 8px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); margin-bottom: 7px; }
    .form-group input { width: 100%; height: var(--control-h-lg); padding: 0 12px; font-size: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); color: var(--text); outline: none; transition: border-color .15s; font-family: inherit; }
    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--text3); }
    .form-group input:-webkit-autofill, .form-group input:-webkit-autofill:hover, .form-group input:-webkit-autofill:focus { -webkit-text-fill-color: var(--text); caret-color: var(--text); transition: background-color 600000s 0s, color 600000s 0s; }
    .pw-row { position: relative; }
    .pw-row input { padding-right: 42px; }
    .pw-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; padding: 3px; display: flex; align-items: center; border-radius: 4px; }
    .pw-eye:hover { color: var(--accent); }
    .pw-track { height: 3px; border-radius: 2px; margin-top: 7px; background: var(--surface2); overflow: hidden; }
    .pw-strength { height: 100%; width: 0; border-radius: 2px; background: transparent; transition: width .3s, background-color .3s; }
    .pw-hint { font-family: var(--font-mono); font-size: 11px; color: var(--text3); margin-top: 5px; }
    .btn-primary { width: 100%; height: var(--control-h-lg); border-radius: var(--radius-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; transition: background .15s, border-color .15s; font-family: inherit; }
    .btn-primary:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent2); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 420px) { .card { padding: 24px 20px; } h2 { font-size: 21px; } }
  </style>
</head>
<body class="mm-grid-ground">

  <main class="main">
    <div class="card mm-frame">
      <div class="brand"><span class="mm-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12h6.5"/><circle cx="12" cy="12" r="3.3"/><path d="M15 10.4 21.5 5.5"/><path d="M15.4 12H22"/><path d="M15 13.6 21.5 18.5"/></svg></span><span class="brand-name">Midleman</span></div>

    <!-- Invalid / expired -->
    <div id="invalidBox" style="display:{{INVALID_DISPLAY}}">
      <h2 class="invalid-title">Convite inválido</h2>
      <p class="invalid-msg">{{INVALID_MSG}}</p>
    </div>

    <!-- Valid invite -->
    <div id="formBox" style="display:{{FORM_DISPLAY}}">
      <h2>Configurar conta</h2>
      <p class="greeting">Foi convidado a tornar-se administrador do Midleman. Escolha um username e defina a sua password.</p>

      <div class="info-box" id="infoBox">
        <div class="info-row" id="nameRow" style="display:none">
          <span class="info-label">Nome</span>
          <span class="info-val" id="nameDisplay"></span>
        </div>
        <div class="info-row" id="emailRow" style="display:none">
          <span class="info-label">Email</span>
          <span class="info-val" id="emailDisplay"></span>
        </div>
        <div class="note-row" id="noteDisplay" style="display:none"></div>
      </div>

      <div class="error" id="regError"></div>
      <div class="success-box" id="regSuccess">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <div id="regSuccessMsg">Conta criada com sucesso! Pode agora fazer login no dashboard.</div>
      </div>

      <div id="registerForm">
        <div class="form-group">
          <label>Username *</label>
          <input type="text" id="invUsername" placeholder="ex: joao.silva" autocomplete="username" spellcheck="false">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <div class="pw-row">
            <input type="password" id="invPassword" placeholder="Mínimo 8 caracteres" autocomplete="new-password" oninput="checkStrength(this.value)">
            <button type="button" class="pw-eye" onclick="togglePw('invPassword',this)" tabindex="-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="pw-track"><div class="pw-strength" id="pwBar"></div></div>
          <div class="pw-hint" id="pwHint"></div>
        </div>
        <div class="form-group">
          <label>Confirmar password *</label>
          <div class="pw-row">
            <input type="password" id="invPassword2" placeholder="Repita a password" autocomplete="new-password">
            <button type="button" class="pw-eye" onclick="togglePw('invPassword2',this)" tabindex="-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="btn-primary" id="regBtn" onclick="doRegister()">Criar conta de administrador</button>
      </div>
    </div>
    </div>
  </main>

  <script>

    const TOKEN     = '{{TOKEN}}';
    const FULL_NAME = '{{FULL_NAME}}';
    const EMAIL     = '{{EMAIL}}';
    const NOTE      = '{{NOTE}}';

    if (FULL_NAME) { document.getElementById('nameDisplay').textContent = FULL_NAME; document.getElementById('nameRow').style.display = 'flex'; }
    if (EMAIL)     { document.getElementById('emailDisplay').textContent = EMAIL; document.getElementById('emailRow').style.display = 'flex'; }
    if (NOTE)      { document.getElementById('noteDisplay').textContent = NOTE; document.getElementById('noteDisplay').style.display = 'block'; }
    if (!FULL_NAME && !EMAIL) { document.getElementById('infoBox').style.display = 'none'; }

    function togglePw(id, btn) {
      const inp = document.getElementById(id), isT = inp.type === 'text';
      inp.type = isT ? 'password' : 'text';
      btn.innerHTML = isT
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    function checkStrength(pw) {
      const bar = document.getElementById('pwBar'), hint = document.getElementById('pwHint');
      if (!pw) { bar.style.width = '0'; bar.style.background = 'var(--surface2)'; hint.textContent = ''; return; }
      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      const cols = ['var(--red)','var(--orange)','var(--orange)','var(--green)','var(--green)'];
      const labels = ['Muito fraca','Fraca','Razoável','Boa','Forte'];
      bar.style.width = (score * 20) + '%';
      bar.style.background = cols[score - 1] || cols[0];
      hint.textContent = labels[score - 1] || '';
    }

    async function doRegister() {
      const btn = document.getElementById('regBtn');
      const errEl = document.getElementById('regError');
      errEl.className = 'error';
      const username = document.getElementById('invUsername').value.trim();
      const pw1 = document.getElementById('invPassword').value;
      const pw2 = document.getElementById('invPassword2').value;
      if (!username || username.length < 2) { errEl.textContent = 'Username deve ter pelo menos 2 caracteres.'; errEl.className = 'error visible'; return; }
      if (!pw1 || pw1.length < 8) { errEl.textContent = 'A password deve ter pelo menos 8 caracteres.'; errEl.className = 'error visible'; return; }
      if (pw1 !== pw2) { errEl.textContent = 'As passwords não coincidem.'; errEl.className = 'error visible'; return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        const res = await fetch(location.pathname + '/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password: pw1 }),
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error || 'Erro ao criar conta.'; errEl.className = 'error visible'; btn.disabled = false; btn.textContent = 'Criar conta de administrador'; return; }
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('regSuccess').className = 'success-box visible';
      } catch (e) {
        errEl.textContent = 'Erro de rede. Tente novamente.';
        errEl.className = 'error visible';
        btn.disabled = false;
        btn.textContent = 'Criar conta de administrador';
      }
    }
  </script>
</body>
</html>

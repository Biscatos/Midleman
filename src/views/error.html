<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{STATUS}} — Midleman</title>
  <script>(function(){try{var k='midleman_theme',p=localStorage.getItem(k);if(p!=='dark'&&p!=='light'&&p!=='system')p='dark';var t=p==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;document.documentElement.setAttribute('data-theme',t);if(p==='system'&&window.matchMedia){var m=matchMedia('(prefers-color-scheme: dark)');var fn=function(e){if(localStorage.getItem(k)==='system')document.documentElement.setAttribute('data-theme',e.matches?'dark':'light')};if(m.addEventListener)m.addEventListener('change',fn);else if(m.addListener)m.addListener(fn)}}catch(e){}})();</script>
  <!-- MM_THEME -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 28px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      margin-bottom: 28px;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .code {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--red);
      font-variant-numeric: tabular-nums;
      margin-bottom: 14px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 24px;
      overflow-wrap: anywhere;
    }

    p a {
      color: var(--accent);
      text-decoration: none;
    }
    p a:hover { color: var(--accent2); text-decoration: underline; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--control-h);
      padding: 0 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: color var(--transition), border-color var(--transition);
    }

    .links a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    @media (max-width: 420px) {
      .card { padding: 22px 18px 18px; }
      .code { font-size: 44px; }
      .links a { flex: 1; }
    }
    /* Flat: no rounded corners (matches the dashboard) */
    *, *::before, *::after { border-radius: 0 !important; }
    [style*="border-radius:50%"], [style*="border-radius: 50%"], .spinner, .dot { border-radius: 50% !important; }
  </style>
</head>

<body class="mm-grid-ground">
  <main class="card mm-frame mm-frame--danger">
    <div class="brand">
      <span class="mm-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="14,8 26,16 18,24" fill="#1E6FAE"/><polygon points="50,8 38,16 46,24" fill="#1E6FAE"/><polygon points="18,24 26,16 38,16 46,24 48,46 32,58 16,46" fill="#2A8BD4"/><polygon points="16,46 18,24 8,40" fill="#1E6FAE"/><polygon points="48,46 46,24 56,40" fill="#1E6FAE"/><polygon points="26,16 38,16 32,22" fill="#1E6FAE"/><polygon points="22,40 32,58 42,40 32,46" fill="#5FB0EA"/><circle cx="25" cy="29" r="6" fill="#fff"/><circle cx="39" cy="29" r="6" fill="#fff"/><circle cx="25.8" cy="29.5" r="2.8" fill="#1E6FAE"/><circle cx="38.2" cy="29.5" r="2.8" fill="#1E6FAE"/><polygon points="29.5,35 34.5,35 32,40" fill="#1E6FAE"/><polygon points="26,58 30,58 28,62" fill="#1E6FAE"/><polygon points="34,58 38,58 36,62" fill="#1E6FAE"/></svg></span>
      <span class="brand-name">Midleman</span>
    </div>
    <div class="code">{{STATUS_CODE}}</div>
    <h1>{{TITLE}}</h1>
    <p>{{MESSAGE}}</p>
    <div class="links">
      <a href="/">Home</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </main>
</body>

</html>
